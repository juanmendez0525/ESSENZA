<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESSENZA App</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">

  <div class="brand">

    <div class="brand-mark">
      <img src="recursos/logo.png" alt="Logo del emprendimiento">
    </div>

    <div class="brand-text">
      <strong>ESSENZA</strong>
      <span>VENTAS & INVENTARIO</span>
    </div>

    <button
      id="sidebarToggle"
      class="sidebar-toggle"
      title="Contraer menú"
    >
      ◀
    </button>

  </div>

  <nav id="sideNav">

    <button data-view="inicio" class="nav-item active">
      ⌂ <span>Inicio</span>
    </button>

    <button data-view="ventas" class="nav-item">
      🛒 <span>Ventas</span>
    </button>

    <button data-view="inventario" class="nav-item">
      ▣ <span>Inventario</span>
    </button>

    <button data-view="apartados" class="nav-item">
      ◷ <span>Apartados</span>
    </button>

    <button data-view="clientes" class="nav-item">
      ♙ <span>Clientes</span>
    </button>

    <button data-view="reportes" class="nav-item">
      ▥ <span>Reportes</span>
    </button>

    <button data-view="configuracion" class="nav-item">
      ⚙ <span>Configuración</span>
    </button>

  </nav>

  <div class="sidebar-footer">
    Prototipo V1 · Local
  </div>

</aside>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn mobile-only">☰</button>
        <div>
          <h1 id="pageTitle">Inicio</h1>
          <p id="pageSubtitle">Resumen de tu negocio</p>
        </div>
        <div class="top-actions">
                
          <div id="backupWrapper">
            <button id="backupBtn" class="secondary-btn">
              💾 Copia
            </button>
            <div class="small">
              Guarda un respaldo de los datos de la aplicación.
            </div>
          </div>
        
          <button
            id="btnCerrarSesionPrueba"
            class="secondary-btn"
          >
            🚪 Cerrar sesión
          </button>
        
        </div>
      </header>

      <section id="appView" class="view-container"></section>
    </main>

    <nav class="bottom-nav" id="bottomNav">
      <button data-view="inicio" class="active">⌂<span>Inicio</span></button>
      <button data-view="ventas">🛒<span>Ventas</span></button>
      <button data-view="inventario">▣<span>Inventario</span></button>
      <button data-view="apartados">◷<span>Apartados</span></button>
      <button data-view="mas">☰<span>Más</span></button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>

  <script src="data/datos-demo.js"></script>
  <script src="js/productos.js"></script>
  <!-- <script src="js/ventas.js"></script> -->
  <script src="js/apartados.js"></script>
  <script src="js/clientes.js"></script>
  <script src="js/reportes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
