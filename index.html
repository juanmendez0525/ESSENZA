<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Makeup App</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">✦</div>
        <div><strong>MAKEUP</strong><span>VENTAS & INVENTARIO</span></div>
      </div>
      <nav id="sideNav">
        <button data-view="inicio" class="nav-item active">⌂ <span>Inicio</span></button>
        <button data-view="ventas" class="nav-item">🛒 <span>Ventas</span></button>
        <button data-view="inventario" class="nav-item">▣ <span>Inventario</span></button>
        <button data-view="apartados" class="nav-item">◷ <span>Apartados</span></button>
        <button data-view="clientes" class="nav-item">♙ <span>Clientes</span></button>
        <button data-view="reportes" class="nav-item">▥ <span>Reportes</span></button>
        <button data-view="configuracion" class="nav-item">⚙ <span>Configuración</span></button>
      </nav>
      <div class="sidebar-footer">Prototipo V1 · Local</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn mobile-only">☰</button>
        <div>
          <h1 id="pageTitle">Inicio</h1>
          <p id="pageSubtitle">Resumen de tu negocio</p>
        </div>
        <div class="top-actions">
          <button id="backupBtn" class="secondary-btn">💾 Copia</button>
        </div>
      </header>

      <section id="appView" class="view-container"></section>
    </main>

    <nav class="bottom-nav" id="bottomNav">
      <button data-view="inicio" class="active">⌂<span>Inicio</span></button>
      <button data-view="ventas">🛒<span>Ventas</span></button>
      <button data-view="inventario">▣<span>Inventario</span></button>
      <button data-view="apartados">◷<span>Apartados</span></button>
      <button data-view="mas">☰<span>Más</span></button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script src="data/datos-demo.js"></script>
  <script src="js/productos.js"></script>
  <script src="js/ventas.js"></script>
  <script src="js/apartados.js"></script>
  <script src="js/clientes.js"></script>
  <script src="js/reportes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
