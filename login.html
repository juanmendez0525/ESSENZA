<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | ESSENZA App</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">
            <img src="recursos/logo.png" alt="Logo de ESSENZA" class="login-logo">
            
                
            </div>

            <h1>ESSENZA</h1>

            <p class="login-subtitle">
                Ventas & Inventario
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="correo@ejemplo.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div
                    id="loginMessage"
                    class="login-message"
                    role="alert"
                ></div>

                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >
                    Ingresar
                </button>

            </form>

        </section>

    </main>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Configuración de Supabase -->
    <script src="js/supabase-config.js"></script>

    <!-- Autenticación -->
    <script src="js/login.js"></script>

</body>
</html>
